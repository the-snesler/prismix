# Example single-user deployment. There is no authentication: the port is bound
# to localhost only. To reach it from other machines, put it behind a reverse
# proxy that adds authentication (or a VPN such as Tailscale) rather than
# publishing it on 0.0.0.0.
services:
  prismix:
    build: .
    image: prismix
    restart: unless-stopped
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      - prismix-data:/data

volumes:
  prismix-data:
